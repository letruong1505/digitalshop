<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3D27">
<title>Màn hình khách · Digital Shop</title>
<link rel="stylesheet" href="app.css">
<style>
/* Màn hình quay về phía khách: một bảng hiệu xanh đậm, số tiền lớn, mã QR khi chuyển khoản */
:root { --cd-bg:#0B3D27; --cd-panel:#0F4A30; --cd-ink:#F4F8F5; --cd-muted:#A9C4B4; --cd-tag:#F4C531; --cd-tag-ink:#2B2000; --cd-line:#1E5C40; --cd-ok:#3DDC97; color-scheme:dark; }
html,body{height:100%;margin:0;background:var(--cd-bg);color:var(--cd-ink);font-family:var(--f-body);overflow:hidden}
.cd{height:100vh;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));box-sizing:border-box;gap:16px}
.top{display:flex;align-items:baseline;gap:16px}
.top b{font-size:clamp(20px,3vw,34px);font-weight:800;text-transform:uppercase;letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top span{color:var(--cd-muted);font-size:clamp(14px,1.6vw,20px);font-variant-numeric:tabular-nums}
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}
@media (max-aspect-ratio:1/1){.body{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}}
.list{background:var(--cd-panel);border-radius:18px;padding:16px 20px;overflow:hidden;display:flex;flex-direction:column}
.list h2{margin:0 0 8px;font-size:clamp(14px,1.4vw,18px);color:var(--cd-muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:10px 0;border-bottom:1px dashed var(--cd-line);font-size:clamp(16px,1.8vw,24px)}
.row .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .q{color:var(--cd-muted);font-size:.8em;font-variant-numeric:tabular-nums}
.row .t{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;grid-row:span 2;align-self:center}
.more{color:var(--cd-muted);padding-top:8px;font-size:clamp(13px,1.3vw,17px)}
.pay{display:flex;flex-direction:column;gap:14px;justify-content:center;align-items:stretch;min-height:0;border-top:0;padding:0}
.total{background:var(--cd-tag);color:var(--cd-tag-ink);border-radius:18px;padding:16px 22px}
.total .k{font-size:clamp(14px,1.5vw,20px);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.total .v{font-size:clamp(40px,6.5vw,92px);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.total .s{font-size:clamp(13px,1.3vw,18px);opacity:.75}
.qr{background:#fff;color:#111;border-radius:18px;padding:14px;display:flex;gap:16px;align-items:center}
.qr svg{width:clamp(150px,22vw,300px);height:auto;aspect-ratio:1;flex:none;max-width:100%}
.qr .i{min-width:0;font-size:clamp(14px,1.4vw,19px);line-height:1.45}
.qr .i b{display:block;font-size:1.3em;letter-spacing:.03em}
.wait{display:inline-flex;align-items:center;gap:8px;color:#8A5A00;font-weight:700}
.wait i{width:10px;height:10px;border-radius:50%;background:#E6A100;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.center{flex:1;display:grid;place-items:center;text-align:center}
.idle h1{font-size:clamp(32px,6vw,80px);margin:0;font-weight:800;line-height:1.1;text-wrap:balance}
.idle p{font-size:clamp(16px,2vw,26px);color:var(--cd-muted);margin:14px 0 0}
.ok .mark{width:clamp(110px,16vw,190px);height:clamp(110px,16vw,190px);border-radius:50%;background:var(--cd-ok);display:grid;place-items:center;margin:0 auto 22px;animation:pop .45s ease-out}
.ok .mark svg{width:58%;height:58%}
.ok h1{font-size:clamp(30px,5vw,68px);margin:0;font-weight:800}
.ok p{font-size:clamp(20px,3vw,40px);margin:12px 0 0;font-variant-numeric:tabular-nums}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.err{color:var(--cd-muted);font-size:20px;max-width:640px}
.fs{position:fixed;right:12px;bottom:12px;background:transparent;border:1px solid var(--cd-line);color:var(--cd-muted);border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;opacity:.5}
.fs:hover{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="cd" id="cd"><div class="center"><div class="err">Đang kết nối…</div></div></div>
<button class="fs" id="fs" type="button">Toàn màn hình</button>
<script src="qrcode.js"></script>
<a id="appcfg" href="http://localhost/?connect=1" hidden style="position:fixed;top:0;left:0;width:56px;height:56px;z-index:9;opacity:0" aria-label="Đổi cài đặt"></a>
<script>
"use strict";
const NF = new Intl.NumberFormat("vi-VN");
const fmt = n => NF.format(Math.round(n || 0));
const fq = n => NF.format(Math.round((n || 0) * 1000) / 1000);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const key = new URLSearchParams(location.search).get("k") || "";
let seq = 0, shop = "", data = { status: "idle" }, idleT = null;
const clock = () => { const d = new Date(); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")} · ${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`; };
function qr(text) { const q = qrcode(0, "M"); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); }
function render() {
  const d = data, el = document.getElementById("cd");
  const top = `<div class="top"><b>${esc(shop || "Tạp hóa")}</b><span id="clk">${clock()}</span></div>`;
  if (d.status === "paid") {
    el.innerHTML = top + `<div class="center ok"><div><div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#0B3D27" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
      <h1>Thanh toán thành công</h1><p>${fmt(d.total)}đ${d.method === "bank" ? " · chuyển khoản" : ""}</p>${d.change ? `<p>Tiền thối lại: <b>${fmt(d.change)}đ</b></p>` : ""}<p style="font-size:clamp(16px,2vw,24px);opacity:.75">Cảm ơn quý khách!</p></div></div>`;
    return;
  }
  if (d.status === "idle" || !d.count) {
    el.innerHTML = top + `<div class="center idle"><div><h1>Xin chào quý khách</h1><p>${esc(shop || "")}</p></div></div>`;
    return;
  }
  const lines = (d.lines || []).map(l => `<div class="row"><span class="n">${esc(l.n)}</span><span class="t">${fmt(l.t)}</span><span class="q">${fq(l.q)} ${esc(l.u)} × ${fmt(l.p)}</span></div>`).join("");
  const hidden = d.count - (d.lines || []).length;
  let pay = `<div class="total"><div class="k">Tổng cần thanh toán</div><div class="v">${fmt(d.total)}đ</div><div class="s">${d.count} món${d.disc ? ` · đã giảm ${fmt(d.disc)}đ` : ""}${d.cust ? ` · ${esc(d.cust)}` : ""}</div></div>`;
  if (d.qr) {
    pay += `<div class="qr">${qr(d.qr)}<div class="i">Quét mã bằng ứng dụng ngân hàng, số tiền đã điền sẵn.${d.bank && d.bank.acct ? `<b>${esc(d.bank.acct)}</b>${esc(d.bank.name)} · ${esc(d.bank.holder)}` : ""}
      <div style="margin-top:10px">${d.paid ? '<span class="wait" style="color:#0B7A47">Đã nhận tiền ✓</span>' : '<span class="wait"><i></i>Đang chờ chuyển khoản</span>'}</div></div></div>`;
  }
  el.innerHTML = top + `<div class="body"><div class="list"><h2>Hàng đã chọn</h2>${hidden > 0 ? `<div class="more">… và ${hidden} món phía trên</div>` : ""}${lines}</div><div class="pay">${pay}</div></div>`;
}
async function loop() {
  if (!key) { document.getElementById("cd").innerHTML = `<div class="center"><div class="err">Thiếu mã màn hình. Mở lại từ Digital Shop → Bán hàng → Màn hình khách.</div></div>`; return; }
  for (;;) {
    try {
      const r = await fetch(`/api/display?k=${encodeURIComponent(key)}&since=${seq}`, { cache: "no-store" });
      if (r.status === 403) { const j = await r.json(); document.getElementById("cd").innerHTML = `<div class="center"><div class="err">${esc(j.error)}</div></div>`; await new Promise(s => setTimeout(s, 10000)); continue; }
      const j = await r.json();
      shop = j.shop; seq = j.seq;
      const changed = JSON.stringify(j.data) !== JSON.stringify(data);
      data = j.data || { status: "idle" };
      if (changed) render();
      clearTimeout(idleT);
      if (data.status === "paid") idleT = setTimeout(() => { data = { status: "idle" }; render(); }, 9000);
    } catch (e) {
      document.getElementById("cd").innerHTML = `<div class="center"><div class="err">Mất kết nối với máy tính tiền, đang thử lại…</div></div>`;
      await new Promise(s => setTimeout(s, 3000));
    }
  }
}
setInterval(() => { const c = document.getElementById("clk"); if (c) c.textContent = clock(); }, 15000);
document.getElementById("fs").addEventListener("click", () => { const d = document.documentElement; (d.requestFullscreen ? d.requestFullscreen() : Promise.reject()).catch(() => {}); });
document.addEventListener("fullscreenchange", () => { document.getElementById("fs").hidden = !!document.fullscreenElement; });
try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
if (/DSApp/.test(navigator.userAgent)) document.getElementById("appcfg").hidden = false; // ứng dụng Android: chạm góc trên trái để đổi chế độ
render(); loop();
</script>
</body>
</html>
